    <h2 id="title">Original Title</h2>

    <p class="description">Original paragraph</p>

    <p>This is a paragraph selected by tag.</p>

    <button id="changeButton">Change Elements</button>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function() {

            $("#changeButton").click(function() {
                $("#title").text("Title Changed!");
                $(".description").html("<b>Paragraph Changed!</b>");
                $("p").css("color", "blue");
            });

        });
    </script>
