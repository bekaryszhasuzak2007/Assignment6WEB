    <h2>Modifying Attributes</h2>

    <h3>Change Image</h3>

    <img id="myImage" src="https://picsum.photos/id/10/300/200" alt="Nature image">

    <br><br>

    <button id="changeImageBtn">Change Image</button>

    <hr>

    <h3>Change Link</h3>

    <a id="myLink" href="https://www.google.com" target="_blank">Open Google</a>

    <br><br>

    <button id="changeLinkBtn">Change Link</button>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function() {

            $("#changeImageBtn").click(function() {
                $("#myImage").attr("src", "https://picsum.photos/id/20/300/200");
            });

            $("#changeLinkBtn").click(function() {
                $("#myLink").attr("href", "https://www.wikipedia.org");
                $("#myLink").text("Open Wikipedia");
            });

        });
    </script>
