    <h2>Accordion Menu</h2>

    <button class="accordion">What is jQuery?</button>
    <div class="content">
        <p>jQuery is a JavaScript library.</p>
    </div>

    <button class="accordion">What is HTML?</button>
    <div class="content">
        <p>HTML is used to create web pages.</p>
    </div>

    <button class="accordion">What is CSS?</button>
    <div class="content">
        <p>CSS is used to style web pages.</p>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function() {

            $(".accordion").click(function() {
                $(this).next(".content").slideToggle();
            });

        });
    </script>
