    <h2>Basic Animation</h2>

    <div id="box"></div>

    <br>

    <button id="animateBtn">Animate Box</button>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function() {

            $("#animateBtn").click(function() {
                $("#box").animate({
                    width: "200px",
                    height: "200px",
                    left: "200px"
                }, 1000);
            });

        });
    </script>
