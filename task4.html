    <h2>Slide Methods</h2>

    <button id="slideDownBtn">Slide Down</button>
    <button id="slideUpBtn">Slide Up</button>
    <button id="slideToggleBtn">Slide Toggle</button>

    <div id="panel" style="display: none; background-color: lightgray; padding: 20px; margin-top: 10px;">
        <p>Hello! This is a collapsible panel.</p>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function() {

            $("#slideDownBtn").click(function() {
                $("#panel").slideDown();
            });

            $("#slideUpBtn").click(function() {
                $("#panel").slideUp();
            });

            $("#slideToggleBtn").click(function() {
                $("#panel").slideToggle();
            });

        });
    </script>
